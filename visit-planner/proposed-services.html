<template id="proposed-computer-services">
  <section class="proposed-services" aria-labelledby="proposed-heading">
    <h2 id="proposed-heading">Proposed services</h2>
    <p>Preview only · Prices to be confirmed · Unavailable for booking</p>
    <div class="proposal-groups">
      <section>
        <h3>Setup</h3>
        <details><summary>Install and set up software</summary>
          <p>Install one licensed app on one compatible computer, apply its basic settings and check that it opens. You provide the license. Custom integrations and business deployments are outside scope.</p>
        </details>
        <details><summary>Back up or transfer files</summary>
          <p>Copy one selected folder from one working computer to one accessible drive you provide, then open a sample of the copied files together. Excludes full-device migration, damaged drives and data recovery.</p>
        </details>
      </section>
      <section>
        <h3>Help &amp; troubleshooting</h3>
        <details><summary>Set up or troubleshoot email</summary>
          <p>Connect one existing account to one mail app, or investigate one sending or receiving issue. You sign in yourself. Excludes password recovery, mailbox migration and mail-server administration.</p>
        </details>
        <details><summary>Get a personal computer lesson</summary>
          <p>Practice one everyday task on your computer, such as organizing files or joining a video call. Includes guided practice and a short set of steps to repeat. Device repair and ongoing support are outside scope.</p>
        </details>
      </section>
    </div>
  </section>
</template>
