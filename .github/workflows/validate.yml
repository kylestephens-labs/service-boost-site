name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s backend -p 'test_*.py'
      - run: node --check app.js
      - run: node --check config.js
      - run: node --test test-attribution.mjs
      - run: python3 build-site.py
      - run: docker build -f backend/Dockerfile -t serviceboost-attribution-test .
      - run: python3 backend/container_smoke.py
